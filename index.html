<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
<title>Mon Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="logo-dot"></div>Mon Agenda</div>
  <div class="topbar-center">
    <div class="month-nav">
      <button class="nav-btn" id="btnPrev">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button class="nav-btn" id="btnNext">›</button>
    </div>
  </div>
  <div class="topbar-right">
    <div class="view-toggle">
      <button class="view-btn active" data-view="month">Mois</button>
      <button class="view-btn" data-view="week">Semaine</button>
      <button class="view-btn" data-view="day">Jour</button>
      <button class="view-btn" data-view="agenda">Agenda</button>
    </div>
    <button class="btn-today" id="btnToday">Aujourd'hui</button>
    <button class="btn-shortcuts" id="btnShortcuts" title="Raccourcis clavier">?</button>
    <button class="btn-new" id="btnNew">＋ Nouveau</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="mini-cal">
      <div class="mini-header">
        <button id="btnMiniPrev">‹</button>
        <span id="miniMonthLabel"></span>
        <button id="btnMiniNext">›</button>
      </div>
      <div class="mini-grid" id="miniGrid"></div>
    </div>

    <div class="sidebar-section">
      <div class="section-title">Affichage</div>
      <label class="toggle-row">
        <span>Mois strict</span>
        <div class="toggle" id="toggleStrict"><div class="toggle-thumb"></div></div>
      </label>
      <div class="theme-row">
        <span>Thème</span>
        <div class="theme-swatches">
          <button class="theme-swatch" data-theme="mocha" title="Mocha" ></button>
          <button class="theme-swatch" data-theme="macchiato" title="Macchiato" ></button>
          <button class="theme-swatch" data-theme="frappe" title="Frappé" ></button>
          <button class="theme-swatch" data-theme="latte" title="Latte" ></button>
        </div>
      </div>
    </div>

    <!-- IMPORT / EXPORT -->
    <div class="sidebar-section">
      <div class="section-title">Données</div>
      <div class="data-actions">
        <button class="btn-data" id="btnExportJSON">⬇ JSON</button>
        <button class="btn-data" id="btnImportJSON">⬆ JSON</button>
        <button class="btn-data" id="btnExportICal">⬇ iCal</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-title">Données</div>
      <div class="data-btns">
        <button class="btn-data" id="btnExportJSON" title="Exporter en JSON">⬇ JSON</button>
        <button class="btn-data" id="btnImportJSON" title="Importer un JSON">⬆ JSON</button>
        <button class="btn-data" id="btnExportICal" title="Exporter en iCal">⬇ iCal</button>
      </div>
    </div>

    <div class="sidebar-section accordion" id="accordionCat">
      <div class="accordion-header" id="accordionCatHeader">
        <div class="accordion-title">
          <span class="section-title" >Catégories</span>
          <span class="accordion-arrow" id="accordionCatArrow">›</span>
        </div>
        <button class="btn-add-cat" id="btnAddCat">＋</button>
      </div>
      <div class="accordion-body" id="accordionCatBody">
        <div class="cat-filter-all" id="catFilterAll">
          <div class="cat-dot" ></div>
          <div class="cat-name">Tous</div>
        </div>
        <div id="catList"></div>
      </div>
    </div>

    <div class="upcoming">
      <div class="section-title">À venir</div>
      <div id="upcomingList"></div>
    </div>
  </div>

  <div class="calendar-area" id="calendarArea"></div>
</div>

<!-- SEARCH -->
<div class="search-wrapper">
  <div class="search-results" id="searchResults"></div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Rechercher...">
    <button class="search-clear" id="searchClear">×</button>
  </div>
</div>

<!-- MODAL ÉVÉNEMENT -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Nouvel événement</div>
      <button class="modal-close" id="btnModalClose">×</button>
    </div>

    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="general">Général</button>
      <button class="modal-tab" data-tab="details">Détails</button>
    </div>

    <div class="modal-body">

      <!-- TAB GÉNÉRAL -->
      <div class="tab-panel active" id="tab-general">
        <div class="form-row">
          <label>Type</label>
          <div class="type-selector">
            <button class="type-opt active-task" data-type="task">✓ Tâche</button>
            <button class="type-opt" data-type="event">◆ Événement</button>
            <button class="type-opt" data-type="reminder">⏰ Rappel</button>
          </div>
        </div>
        <div class="form-row">
          <label>Titre</label>
          <input type="text" id="evTitle" placeholder="Nom de l'événement...">
        </div>
        <div class="form-row">
          <label>Date</label>
          <input type="date" id="evDate">
        </div>
        <div class="form-row">
          <label>Heure</label>
          <input type="time" id="evTime">
        </div>
        <div class="form-row">
          <label>Note</label>
          <textarea id="evNote" rows="2" placeholder="Détails optionnels..."></textarea>
        </div>
        <div class="form-row">
          <label>Rappel</label>
          <select id="evReminder">
            <option value="">Pas de rappel</option>
            <option value="5">5 min avant</option>
            <option value="15">15 min avant</option>
            <option value="30">30 min avant</option>
            <option value="60">1 heure avant</option>
            <option value="1440">1 jour avant</option>
          </select>
        </div>
      </div>

      <!-- TAB DÉTAILS -->
      <div class="tab-panel" id="tab-details">
        <div class="form-row-2">
          <div class="form-row">
            <label>Emoji</label>
            <div class="emoji-field-wrap">
              <button class="emoji-trigger" id="emojiTrigger"><span id="emojiPreview">＋</span></button>
              <span class="emoji-clear" id="emojiClear">×</span>
            </div>
          </div>
          <div class="form-row">
            <label>Catégorie</label>
            <select id="evCategory"><option value="">Aucune</option></select>
          </div>
        </div>
        <div class="form-row">
          <label>Couleur</label>
          <div class="color-picker" id="colorPicker">
            <button class="color-opt selected" data-color=""></button>
            <button class="color-opt" data-color="#e85d5d"></button>
            <button class="color-opt" data-color="#e8935d"></button>
            <button class="color-opt" data-color="#d4c23a"></button>
            <button class="color-opt" data-color="#5db85d"></button>
            <button class="color-opt" data-color="#5d9ee8"></button>
            <button class="color-opt" data-color="#a05de8"></button>
            <button class="color-opt" data-color="#e85da0"></button>
            <button class="color-opt" data-color="#5de8d4"></button>
          </div>
        </div>

        <!-- DURÉE ou RÉPÉTITION — mutuellement exclusifs -->
        <div class="form-row">
          <label>Durée / Répétition</label>
          <div class="mode-selector">
            <button class="mode-opt active" data-mode="once">Ponctuel</button>
            <button class="mode-opt" data-mode="multiday">Multi-jours</button>
            <button class="mode-opt" data-mode="repeat">Répétition</button>
          </div>
        </div>

        <!-- Panneau multi-jours -->
        <div class="mode-panel" id="panel-multiday">
          <div class="form-row">
            <label class="label-with-hint">
              Date de fin
              <span class="hint" title="L'événement s'affiche en barre continue du début jusqu'à cette date.">?</span>
            </label>
            <input type="date" id="evDateEnd">
            <span class="field-error" id="dateEndError"></span>
          </div>
        </div>

        <!-- Panneau répétition -->
        <div class="mode-panel" id="panel-repeat">
          <div class="form-row">
            <label>Fréquence</label>
            <select id="evRepeat">
              <option value="daily">Chaque jour</option>
              <option value="weekly">Chaque semaine</option>
              <option value="monthly">Chaque mois</option>
              <option value="yearly">Chaque année</option>
            </select>
          </div>
          <div class="form-row">
            <label class="label-with-hint">
              Arrêter le
              <span class="hint" title="Laissez vide pour une répétition sans fin.">?</span>
            </label>
            <input type="date" id="evRepeatEnd">
          <span class="field-error" id="repeatEndError"></span>
          </div>
        </div>

      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-delete" id="btnDelete">🗑 Supprimer</button>
      <div class="modal-footer-actions">
        <button class="btn-cancel" id="btnCancel">Annuler</button>
        <button class="btn-save" id="btnSave">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- EMOJI PICKER -->
<div class="emoji-picker" id="emojiPicker">
  <div class="emoji-picker-tabs" id="emojiTabs"></div>
  <div class="emoji-picker-grid" id="emojiGrid"></div>
</div>

<!-- MODAL CATÉGORIE -->
<div class="modal-overlay" id="catModalOverlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" id="catModalTitle">Nouvelle catégorie</div>
      <button class="modal-close" id="btnCatModalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>Nom</label>
        <input type="text" id="catName" placeholder="Ex: Boulot, Sport...">
      </div>
      <div class="form-row-2">
        <div class="form-row">
          <label>Emoji</label>
          <div class="emoji-field-wrap">
            <button class="emoji-trigger" id="catEmojiTrigger"><span id="catEmojiPreview">＋</span></button>
            <span class="emoji-clear" id="catEmojiClear">×</span>
          </div>
        </div>
        <div class="form-row">
          <label>Couleur</label>
          <input type="color" id="catColor" value="#7c6af5">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="btnCatDelete">🗑 Supprimer</button>
      <div class="modal-footer-actions">
        <button class="btn-cancel" id="btnCatCancel">Annuler</button>
        <button class="btn-save" id="btnCatSave">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- KEYBOARD SHORTCUTS TOOLTIP -->
<div class="shortcuts-hint" id="shortcutsHint">
  <div class="shortcut-row"><kbd>N</kbd> Nouvel événement</div>
  <div class="shortcut-row"><kbd>T</kbd> Aujourd'hui</div>
  <div class="shortcut-row"><kbd>M</kbd> Vue Mois</div>
  <div class="shortcut-row"><kbd>W</kbd> Vue Semaine</div>
  <div class="shortcut-row"><kbd>D</kbd> Vue Jour</div>
  <div class="shortcut-row"><kbd>A</kbd> Vue Agenda</div>
  <div class="shortcut-row"><kbd>←</kbd><kbd>→</kbd> Naviguer</div>
  <div class="shortcut-row"><kbd>Esc</kbd> Fermer</div>
</div>

<div class="toast" id="toast">
  <span id="toastIcon">🔔</span>
  <span id="toastMsg"></span>
</div>

<script src="renderer.js"></script>
</body>
</html>
